<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Over Screen</title>
<style>
  body {
    text-align: center;
    font-family: Arial, sans-serif;
    background-color: lightyellow; 
    padding-top: 100px;
  }

  h1 {
    color: green;
    font-size: 50px;
  }

  button {
    margin: 10px;
    padding: 15px 25px;
    font-size: 18px;
    cursor: pointer;
  }

  .play { background-color: lightgreen; }
  .share { background-color: lightblue; }
  .exit { background-color: lightgray; }
  .next { background-color: gold; }
</style>
</head>
<body>

<h1>YOU WIN!</h1>

<button class="play" onclick="restartGame()">Play Again</button>
<button class="share" onclick="shareScore()">Share Victory</button>
<button class="exit" onclick="exitGame()">Main Menu</button>
<button class="next" onclick="nextChallenge()">Next Challenge</button>

<script>
  function restartGame() {
    alert("Restart the game!"); 
    // location.reload(); // 
  }

  function shareScore() {
    alert("Share your score!");
  }

  function exitGame() {
    alert("Return to main menu"); 
  }

  function nextChallenge() {
    alert("Go to next challenge!"); 
  }
</script>

</body>
</html>
