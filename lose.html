<html>
  <head>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.6.0/dist/aframe-extras.min.js"></script>
    <script src="script.js"></script>

    <style>
      @font-face {
        font-family: 'digital'; /* set name */
        src: url('digital.ttf'); /* url of the font */
      }

      #timeDisplay {
        font-family: digital;
        color: red;
      }
      
    </style>
  </head>

  <body>
    <a-scene>

      <a-assets>
          <img id="ground" src="RedLightGreen/Ground_baseColor.png">
          <img id="wall" src="RedLightGreen/Walls_baseColor.jpeg">
          <img id="ceiling" src="RedLightGreen/Metal_baseColor.jpeg">
          <img id="houseWall" src="RedLightGreen/House_baseColor.jpeg">
          <img id="door" src="RedLightGreen/Door_baseColor.png">
          <img id="roofTile" src="RedLightGreen/Roof_baseColor.png">
      </a-assets>

      <a-plane width="200" height="300" rotation="-90 0 0" src="#ground" repeat="15 20"></a-plane>


     <a-camera  id="player" position="0 3 135"  wasd-controls="fly:false; acceleration: 500">
        <a-cursor>
          <a-text id="valueDisplay" position="0 -0.5 -1"></a-text>
        </a-cursor>
     </a-camera>

    </a-scene>
  </body>
</html>
