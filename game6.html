<html>
<head>
<script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.6.0/dist/aframe-extras.min.js"></script>
<script src="game6.js"></script>
</head>

<body>
<a-scene>

    <a-assets>
        <img id="ground" src="RedLightGreen/Ground_baseColor.png">
        <img id="wall" src="RedLightGreen/Walls_baseColor.jpeg">
        <img id="ceiling" src="RedLightGreen/Metal_baseColor.jpeg">
        <img id="houseWall" src="RedLightGreen/House_baseColor.jpeg">
        <img id="door" src="RedLightGreen/Door_baseColor.png">
        <img id="roofTile" src="RedLightGreen/Roof_baseColor.png">

        <img id="shirt" src="Final/shirt.jpeg">

        <a-asset-item id="dollSG" src="dollSG/scene.gltf" ></a-asset-item>
        <a-asset-item id="knifeSG" src="knifeSG/scene.gltf"></a-asset-item>
    </a-assets>

    <a-entity id="walls">
    <a-box position="0 17 -150" width="100" height="45" depth="1" src="#wall"></a-box>
    <a-box position="-50 17 0" rotation="0 90 0" width="300" height="45" depth="1" src="#wall" repeat="3 1"></a-box>
    <a-box position="50 17 0" rotation="0 -90 0" width="300" height="45" depth="1" src="#wall" repeat="3 1"></a-box>
    <a-box position="0 17 150" width="100" height="45" depth="1" src="#wall"></a-box>
    </a-entity>

    <a-entity id="houseS" position="0 0 50">
    <a-entity id="house2" position="30 0 0">
        <a-box position="0 1 100" width="13" height="10" depth="5" src="#houseWall" repeat="2 2"></a-box>
        <a-box position="0 2 97.9" width="4.5" height="4.5" src="#door"></a-box>
        <a-box position="-4.5 2.25 97.9" width="2" height="2" color="#16482d"> </a-box>
        <a-cylinder position="-4.5 3.25 97.9" rotation="90 0 0"radius="1" height="1" color="#16482d"></a-cylinder>

        <a-entity id="chimney">
        <a-box position="0 7 98" width="3" height="4" depth="3" src="#houseWall"></a-box>
        <a-box position="0 9 98" width="3.5" height="0.5" depth="3.5" src="#houseWall"></a-box>
        </a-entity> 

        <a-entity id="roof">
        <a-box position="0 7.25 98.5" rotation="50 180 0" width="14" height="0.25" depth="7" src="#roofTile" repeat="1 1" ></a-box>
        <a-cylinder position="-6.75 7 100.5" rotation="280 0 90" radius="3.5" height="0.25" src="#roofTile" segments-radial="3"></a-cylinder>
        <a-cylinder position="6.75 7 100.5" rotation="280 0 90" radius="3.5" height="0.25" src="#roofTile" segments-radial="3"></a-cylinder>
        </a-entity>
    </a-entity>
    <a-entity id="house1">
        <a-box position="0 1 100" width="13" height="10" depth="5" src="#houseWall" repeat="2 2"></a-box>
        <a-box position="0 2 97.9" width="4.5" height="4.5" src="#door"></a-box>
        <a-box position="-4.5 2.25 97.9" width="2" height="2" color="#16482d"> </a-box>
        <a-cylinder position="-4.5 3.25 97.9" rotation="90 0 0"radius="1" height="1" color="#16482d"></a-cylinder>

        <a-entity id="chimney">
        <a-box position="0 7 98" width="3" height="4" depth="3" src="#houseWall"></a-box>
        <a-box position="0 9 98" width="3.5" height="0.5" depth="3.5" src="#houseWall"></a-box>
        </a-entity> 

        <a-entity id="roof">
        <a-box position="0 7.25 98.5" rotation="50 180 0" width="14" height="0.25" depth="7" src="#roofTile" repeat="1 1" ></a-box>
        <a-cylinder position="-6.75 7 100.5" rotation="280 0 90" radius="3.5" height="0.25" src="#roofTile" segments-radial="3"></a-cylinder>
        <a-cylinder position="6.75 7 100.5" rotation="280 0 90" radius="3.5" height="0.25" src="#roofTile" segments-radial="3"></a-cylinder>
        </a-entity>
    </a-entity>
    <a-entity id="house3" position="-30 0 0">
        <a-box position="0 1 100" width="13" height="10" depth="5" src="#houseWall" repeat="2 2"></a-box>
        <a-box position="0 2 97.9" width="4.5" height="4.5" src="#door"></a-box>
        <a-box position="-4.5 2.25 97.9" width="2" height="2" color="#16482d"> </a-box>
        <a-cylinder position="-4.5 3.25 97.9" rotation="90 0 0"radius="1" height="1" color="#16482d"></a-cylinder>

        <a-entity id="chimney">
        <a-box position="0 7 98" width="3" height="4" depth="3" src="#houseWall"></a-box>
        <a-box position="0 9 98" width="3.5" height="0.5" depth="3.5" src="#houseWall"></a-box>
        </a-entity> 

        <a-entity id="roof">
        <a-box position="0 7.25 98.5" rotation="50 180 0" width="14" height="0.25" depth="7" src="#roofTile" repeat="1 1" ></a-box>
        <a-cylinder position="-6.75 7 100.5" rotation="280 0 90" radius="3.5" height="0.25" src="#roofTile" segments-radial="3"></a-cylinder>
        <a-cylinder position="6.75 7 100.5" rotation="280 0 90" radius="3.5" height="0.25" src="#roofTile" segments-radial="3"></a-cylinder>
        </a-entity>
    </a-entity>                 
    </a-entity>

    <a-entity position="-8 25 -148">
    <a-text id="timeDisplay" scale="30 30 30" side="double"></a-text>
    <div id="timeDisplay"></div>
    </a-entity>
    
    <!-- DOLL -->
    <a-entity position="0 0 -133" rotation="0 0 0">
    <a-gltf-model id="doll" src="#dollSG" scale="5 5 5"></a-gltf-model>
    </a-entity>

    <a-box id="finishLine" position="0 -0.8 -125" color="#FF3F79" width="100" height="2" depth="1.5" ></a-box>
    <a-plane width="200" height="300" rotation="-90 0 0" src="#ground" repeat="15 20"></a-plane>
    <a-box width="200" depth="300" position=" 0 40 0" rotation="180 0 0" src="#ceiling" repeat="15 20"></a-box>
    <a-sky color="black"></a-sky>
    

    
    <!-- the other guy who has the audacity to hit me -->
    <a-entity id="otherGuy" position="0 3 105">
        <a-plane id="otherHpBarBg" position="0 3 0" width="2" height="0.2" color="red"></a-plane>
        <a-plane id="otherHpBar" position="0 3 0.02" width="2" height="0.2" color="green"></a-plane>
        <a-sphere color="#EAB794"></a-sphere>
        <a-sphere radius='0.25' position="-0.45 0 1" color="black"></a-sphere>
        <a-sphere radius='0.25' position="0.45 0 1" color="black"></a-sphere>
        <a-cylinder src="#shirt" position="0 -2.1 0" rotation="0 180 0" height="3"></a-cylinder>
        <a-entity position="1 -0.5 2.5" rotation="0 180 0">
            <a-gltf-model id="knife2" src="#knifeSG" scale="5 5 5"></a-gltf-model>
        </a-entity>
    </a-entity>

    <a-camera  id="player" position="0 3 135"  wasd-controls="fly:false; acceleration: 100">
        <a-plane id="myHpBar" position="-0.3 0.4 -0.97" width="0.6" height="0.08" color="green"></a-plane>
        <a-entity position="1.5 -0.5 -2.5" rotation="0 0 0">
            <a-gltf-model id="knife" src="#knifeSG" scale="5 5 5"></a-gltf-model>
        </a-entity>
        <a-text id="valueDisplay" position="-0.65 -0.75 -0.5"></a-text>
    </a-camera>`

</a-scene>
</body>
<script>
window.onload = () => {
    let bgAudio = new Audio('audio/game6.mp3');
    bgAudio.volume = 0.45;
    bgAudio.loop = true;
    bgAudio.play();
};
</script>
</html>
