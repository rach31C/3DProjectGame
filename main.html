<html>
  <head>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.6.0/dist/aframe-extras.min.js"></script>
    <script src="script.js"></script>
  </head>

  <body>
    <a-scene>

      <a-assets>
        <a-asset-item id="lobby" src="lobby/scene.gltf"></a-asset-item>
        <a-asset-item id="game1" src="RedGreenLight/scene.gltf"></a-asset-item>
        <a-asset-item id="tug" src="TugOfWar/scene.gltf"></a-asset-item>
        <a-asset-item id="glass" src="Bridge/scene.gltf"></a-asset-item>
      </a-assets>

      <a-entity id="game-container"></a-entity>

      <a-entity game-manager></a-entity>

    <!-- PLAYER 1 (YOU) -->
<a-entity position="0 1.6 0">
<a-cylinder id="player1" position="" player1-controls></a-cylinder>
</a-entity>

<!-- PLAYER 2 (NPC / Friend) -->
 <a-entity position="1 0.5 -3">
 <a-cylinder id="player2" color="blue" player1-controls></a-cylinder>
 </a-entity>


       <a-camera>
        <a-text id="time" value="Time: " color="black" position="4 2 -3"></a-text>
      </a-camera>

    </a-scene>
  </body>
</html>
