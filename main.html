<html>
  <head>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.6.0/dist/aframe-extras.min.js"></script>
    <script src="script.js"></script>
  </head>

  <body>
    <a-scene>

      <a-assets>
        <a-asset-item id="lobby" src="lobby/scene.gltf"></a-asset-item>
        <a-asset-item id="game1" src="RedGreenLight/scene.gltf"></a-asset-item>
        <a-asset-item id="tug" src="TugOfWar/scene.gltf"></a-asset-item>
        <a-asset-item id="glass" src="Bridge/scene.gltf"></a-asset-item>
      </a-assets>

      <a-entity id="game-container"></a-entity>

      <a-entity game-manager></a-entity>

    <!-- PLAYER 1 (YOU) -->
    <a-entity id="player1" radius="0.5" position="0 0 0" scale="0.4 0.4 0.4" player-controls>
      <a-cylinder position="0 0 0" height= "3" src="player456.jpg" repeat="2 1"></a-cylinder>
      <a-sphere position="0 2.5 0" src="smile.png" repeat="2 1" rotation="0 90 0"></a-sphere>
    </a-entity>
     

<!-- PLAYER 2 (NPC / Friend) -->
 <a-entity id="player2" radius="0.5" position="0 0 0" scale="0.4 0.4 0.4" player-controls>
      <a-cylinder position="0 0 0" height= "3"></a-cylinder>
      <a-sphere position="0 2.5 0"></a-sphere>
    </a-entity>
     


       <a-camera>
        <a-text id="time" value="Time: " color="black" position="4 2 -3"></a-text>
      </a-camera>

    </a-scene>
  </body>
</html>
