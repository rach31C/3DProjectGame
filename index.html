<html>
  <head>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      function openCredit(){
        document.getElementById("credits").style.display = "block";
        document.getElementById("credits").style.transition = "display 0.5 ease";
      }

      function closeCredit(){
        document.getElementById("credits").style.display = "none";
        document.getElementById("credits").style.transition = "display 0.5 ease";
      }
    </script>
  </head>
  <body style="margin: 0; background: linear-gradient(rgba(0, 0, 0, 0.548), rgba(0, 0, 0, 0.548)), url('titleBG.gif') no-repeat center center fixed; background-size: cover;">
    
    <button class="button-credits" onclick="openCredit()">
      Credits
    </button>
    <div id="credits" class="overlay-credits">
      <div class="box-credits">
        <span class="close-credits" onclick="closeCredit()">Credits</span>
        <div class="text-credits">
          <h2>Developers</h2>
          <ul>
            <li>Rachel Cheah</li>
            <li>Celina Lin</li>
            <li>Fang Bing Lin</li>
          </ul>
        </div>
      </div>
      hello johnny
    </div>

    <div class="container-fluid" style="width:95%;">
      <div class="row my-5 d-flex justify-content-center">
        <img style="width: 40%; height:40%;" class="staticTitle" src="SGStaticTitle.png">
      </div>
      <div class="row d-flex justify-content-center flex-wrap">
        <div class="col enter enterPlayer">
          <div class= "d-flex align-items-center flex-column">
            <h3>PLAYER</h3>
            <p>Join at your own risk to achieve your dreams...</p>
            <br>
            <a href="main.html" class="playerButton">Enter</a>
          </div>
        </div>
        <div class="col enter enterGuard">
          <div class= "d-flex align-items-center flex-column">
            <h3>PINK GUARD</h3>
            <p>Get ready to serve and kill...</p>
            <br>
            <a href="main.html" class="guardButton">Enter</a>
          </div>
        </div>
      </div>
    </div>  
       


  </body>
</html>
